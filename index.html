.lt{--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;display:flex;justify-content:center}
.lt *{box-sizing:border-box}
.phone{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;color:var(--ink);
 background:radial-gradient(70% 45% at 18% 12%,var(--neb1) 0%,transparent 62%),radial-gradient(60% 45% at 84% 86%,var(--neb2) 0%,transparent 60%),linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%)}
@media(min-width:520px){.lt{padding:24px 0}.phone{min-height:840px;border-radius:38px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.screen{flex:1;overflow-y:auto;padding:22px 20px 100px;position:relative;z-index:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500}
.h1{font-size:25px;font-weight:500;letter-spacing:-.01em;line-height:1.18;margin:8px 0 6px}
.h2{font-size:16px;font-weight:500;letter-spacing:.02em;margin:0}
.title{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:400;color:var(--ink2)}
.sub{color:var(--ink2);font-size:14px;line-height:1.5;margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;font-size:14px;padding:12px 16px;border-radius:13px;cursor:pointer;transition:transform .08s,background .12s,border-color .12s;width:100%;text-align:left}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;letter-spacing:.06em}
.btn.ghost{background:transparent;text-align:center;color:var(--ink2)}
.btn.small{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dur{min-width:60px;text-align:center}
.input{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--surface);color:var(--ink)}
.input::placeholder{color:var(--muted)}
.bar{height:5px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;border:0;background:transparent;font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab.on{color:var(--ink)}.tab svg{width:21px;height:21px}
.fab{position:absolute;right:18px;bottom:80px;width:54px;height:54px;border-radius:999px;background:var(--ink);color:var(--bg);border:0;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:6}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:14px 20px 30px;animation:up .28s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--surface2);margin:0 auto 14px}
.toasts{position:absolute;left:0;right:0;bottom:140px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;animation:toast 1.8s ease forwards;display:flex;gap:8px;align-items:center}
@keyframes toast{0%{transform:translateY(12px);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.66);z-index:40;display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.levelup{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:26px;padding:26px 22px 18px;width:100%;text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.flare{transform-origin:center;animation:flare 1.4s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes flare{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.core{transform-origin:center;animation:corepop .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes corepop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.reveal{transform-origin:center;animation:reveal 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
.node,.region{cursor:pointer}.node:focus-visible,.region:focus-visible{outline:none}
.node:focus-visible circle:last-of-type{stroke:var(--ink);stroke-width:2}
.progress{display:flex;gap:4px;margin-bottom:18px}.progress i{flex:1;height:3px;border-radius:2px;background:var(--surface2);display:block}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--surface2);display:block}
.list>*+*{margin-top:8px}.section+.section{margin-top:22px}
.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;text-align:left;color:var(--ink);transition:background .12s}
.rowbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.rowbtn:hover{background:var(--surface2)}
.tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);letter-spacing:.04em}
.swatch{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.swatch.on{border-color:var(--ink)}
button:focus-visible,.chip:focus-visible,.rowbtn:focus-visible,.swatch:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
